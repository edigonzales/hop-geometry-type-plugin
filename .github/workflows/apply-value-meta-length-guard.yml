name: apply-value-meta-length-guard

on:
  push:
    branches:
      - agent/value-meta-curve-support

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Reject negative geometry WKB size'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/value-meta-curve-support

      - name: Patch negative WKB size handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('hop-geometry-type/src/main/java/com/atolcd/hop/core/row/value/ValueMetaGeometry.java')
          text = path.read_text()
          old = "            int size = inputStream.readInt();\n            byte[] buffer = new byte[size];\n"
          new = "            int size = inputStream.readInt();\n            if (size < 0) {\n              throw new HopFileException(toString() + \" : Negative geometry WKB size: \" + size);\n            }\n            byte[] buffer = new byte[size];\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one WKB size block, found {count}')
          path.write_text(text.replace(old, new))

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hop-geometry-type/src/main/java/com/atolcd/hop/core/row/value/ValueMetaGeometry.java
          git commit -m 'Reject negative geometry WKB size'
          git push
