name: Verify Geometry Type plugin

on:
  workflow_call:

permissions:
  contents: read

env:
  CI_REF: 51aa132e7dccb385f1c8687fda1e83817e9f731b
  POM_FILE: assemblies/assemblies-hop-geometry-type/pom.xml
  ZIP_GLOB: assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-*.zip
  ARTIFACT_PREFIX: hop-geometry-type-plugin
  PLUGIN_ROOT: plugins/misc/hop-geometry-type
  HOP_VERSION: 2.19.0

jobs:
  canonical:
    name: Canonical (ubuntu-latest, Java 21)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hop
          POSTGRES_PASSWORD: hop
          POSTGRES_DB: hop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hop -d hop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: ${{ env.CI_REF }}
          path: .ci/hop-plugin-ci
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure common Maven repositories
        run: python3 .ci/hop-plugin-ci/scripts/write_maven_settings.py --output "$RUNNER_TEMP/maven-settings.xml"

      - name: Build and test canonical ZIP
        env:
          MAVEN_SETTINGS: ${{ runner.temp }}/maven-settings.xml
          POSTGIS_TEST_ENABLED: 'true'
          POSTGIS_TEST_HOST: localhost
          POSTGIS_TEST_PORT: '5432'
          POSTGIS_TEST_DATABASE: hop
          POSTGIS_TEST_USER: hop
          POSTGIS_TEST_PASSWORD: hop
        run: mvn -s "$MAVEN_SETTINGS" -U -B -ntp clean verify

      - name: Run distribution validation
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash scripts/check-distribution.sh

      - name: Create canonical manifest
        env:
          MAVEN_SETTINGS: ${{ runner.temp }}/maven-settings.xml
        run: |
          set -euo pipefail
          mkdir -p .ci/verified/upload
          version="$(mvn -q -s "$MAVEN_SETTINGS" -f "$POM_FILE" -DforceStdout help:evaluate -Dexpression=project.version)"
          python3 .ci/hop-plugin-ci/scripts/build_manifest.py \
            --zip-glob "$ZIP_GLOB" \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --group-id ch.so.agi \
            --artifact-id hop-geometry-type-plugin \
            --hop-version "$HOP_VERSION" \
            --plugin-root "$PLUGIN_ROOT" \
            --output .ci/verified/manifest.json
          zip_path="$(find assemblies/assemblies-hop-geometry-type/target -maxdepth 1 -type f -name 'hop-geometry-type-plugin-*.zip' -print)"
          test "$(printf '%s\n' "$zip_path" | wc -l)" -eq 1
          cp "$zip_path" .ci/verified/upload/
          cp .ci/verified/manifest.json .ci/verified/upload/hop-geometry-type-plugin-canonical.manifest.json

      - name: Upload canonical ZIP and manifest
        uses: actions/upload-artifact@v4
        with:
          name: hop-geometry-type-plugin-canonical
          if-no-files-found: error
          path: .ci/verified/upload/*

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-hop-geometry-type-plugin-canonical
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  compatibility:
    name: Compatibility (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        java: ['21', '25']
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: ${{ env.CI_REF }}
          path: .ci/hop-plugin-ci
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Configure common Maven repositories
        run: python3 .ci/hop-plugin-ci/scripts/write_maven_settings.py --output "$RUNNER_TEMP/maven-settings.xml"

      - name: Run compatibility tests
        run: mvn -s "$RUNNER_TEMP/maven-settings.xml" -U -B -ntp test

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-hop-geometry-type-plugin-${{ matrix.os }}-jdk${{ matrix.java }}
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
