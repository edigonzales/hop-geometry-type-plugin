name: apply-value-meta-curve-support

on:
  push:
    branches:
      - agent/value-meta-curve-support

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Integrate curve WKB into ValueMetaGeometry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/value-meta-curve-support

      - name: Patch ValueMetaGeometry
        shell: python
        run: |
          from pathlib import Path

          path = Path('hop-geometry-type/src/main/java/com/atolcd/hop/core/row/value/ValueMetaGeometry.java')
          text = path.read_text()
          replacements = [
              (
                  'import com.atolcd.hop.gis.utils.GeometryUtils;',
                  'import com.atolcd.hop.gis.geometry.curve.CurveGeometrySupport;\nimport com.atolcd.hop.gis.utils.GeometryUtils;',
              ),
              (
                  'Geometry cloneGeometry = new GeometryFactory().createGeometry(geometry);',
                  'Geometry cloneGeometry = CurveGeometrySupport.copy(geometry);',
              ),
              (
                  'return new WKBReader().read(buffer);',
                  'return CurveGeometrySupport.readWkb(buffer);',
              ),
              (
                  'byte[] binary = new WKBWriter().write((Geometry) object);',
                  'byte[] binary = CurveGeometrySupport.writeWkb((Geometry) object);',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hop-geometry-type/src/main/java/com/atolcd/hop/core/row/value/ValueMetaGeometry.java
          git commit -m 'Integrate curve WKB into ValueMetaGeometry'
          git push
