name: Publish Maven snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@16f5518dc21ad5053ce4f137c6bdf97a5ebce5b7
    with:
      ci-ref: 16f5518dc21ad5053ce4f137c6bdf97a5ebce5b7
      repository-kind: snapshot
      verified-artifact-name: hop-geometry-type-plugin-canonical
      pom-file: assemblies/assemblies-hop-geometry-type/pom.xml
      artifact-id: hop-geometry-type-plugin
      plugin-root: plugins/misc/hop-geometry-type
      extra-maven-artifacts: >-
        [{"file":".ci/publish/hop-geometry-type.jar","pom-file":".ci/publish/hop-geometry-type.pom","packaging":"jar"},
         {"file":".ci/publish/hop-geometry-type-parent.pom","pom-file":".ci/publish/hop-geometry-type-parent.pom","packaging":"pom"}]
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
