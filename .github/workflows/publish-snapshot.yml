name: Publish Maven snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@c899bc6b8fc2cf6bc65eab356438ffdc1fafa1b2
    with:
      ci-ref: c899bc6b8fc2cf6bc65eab356438ffdc1fafa1b2
      repository-kind: snapshot
      verified-artifact-name: hop-geometry-type-plugin-canonical
      pom-file: assemblies/assemblies-hop-geometry-type/pom.xml
      artifact-id: hop-geometry-type-plugin
      plugin-root: plugins/misc/hop-geometry-type
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
