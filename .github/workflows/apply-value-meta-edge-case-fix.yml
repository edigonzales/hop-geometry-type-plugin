name: apply-value-meta-edge-case-fix

on:
  push:
    branches:
      - agent/value-meta-curve-support

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fail cleanly on invalid geometry WKB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/value-meta-curve-support

      - name: Patch ValueMetaGeometry parse failure handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('hop-geometry-type/src/main/java/com/atolcd/hop/core/row/value/ValueMetaGeometry.java')
          text = path.read_text()
          old = '''          } catch (ParseException e) {
            e.printStackTrace();
          }
'''
          new = '''          } catch (ParseException e) {
            throw new HopFileException(toString() + " : Unable to parse geometry WKB", e);
          }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one parse catch block, found {count}')
          path.write_text(text.replace(old, new))

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hop-geometry-type/src/main/java/com/atolcd/hop/core/row/value/ValueMetaGeometry.java
          git commit -m 'Fail cleanly on invalid geometry WKB'
          git push
