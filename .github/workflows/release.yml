name: build-and-publish

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: hop
          POSTGRES_PASSWORD: hop
          POSTGRES_DB: hop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hop -d hop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B -ntp clean verify
        env:
          POSTGIS_TEST_ENABLED: "true"
          POSTGIS_TEST_HOST: localhost
          POSTGIS_TEST_PORT: "5432"
          POSTGIS_TEST_DATABASE: hop
          POSTGIS_TEST_USER: hop
          POSTGIS_TEST_PASSWORD: hop

      - name: Verify plugin runtime layout
        shell: bash
        run: |
          set -euo pipefail
          ZIP="assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-0.1.0-SNAPSHOT.zip"
          test -f "$ZIP"
          unzip -l "$ZIP" > /tmp/geometry-type-zip.txt

          grep -E 'plugins/misc/hop-geometry-type/hop-geometry-type-[^/]+\.jar$' /tmp/geometry-type-zip.txt
          grep -E 'plugins/misc/hop-geometry-type/lib/jts-core-[^/]+\.jar$' /tmp/geometry-type-zip.txt

          if grep -E 'plugins/misc/hop-geometry-type/jts-core-[^/]+\.jar$' /tmp/geometry-type-zip.txt; then
            echo "jts-core must be packaged under hop-geometry-type/lib, not in the plugin root" >&2
            exit 1
          fi

          if grep -E 'plugins/misc/hop-geometry-type/(lib/)?postgresql-[^/]+\.jar$' /tmp/geometry-type-zip.txt; then
            echo "PostgreSQL JDBC must be provided by Hop's PostgreSQL database plugin, not sogeo-geometry" >&2
            exit 1
          fi

          if grep -E 'plugins/misc/hop-geometry-type/(lib/)?postgis-jdbc-[^/]+\.jar$' /tmp/geometry-type-zip.txt; then
            echo "postgis-jdbc must not be packaged in the shared geometry runtime" >&2
            exit 1
          fi

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: geometry-type-plugin-zip
          if-no-files-found: error
          path: assemblies/assemblies-hop-geometry-type/target/hop-geometry-type-plugin-*.zip

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Create Maven settings for release + snapshot repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>sogeo-releases</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
              <server>
                <id>sogeo-snapshots</id>
                <username>${env.MAVEN_USERNAME}</username>
                <password>${env.MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish to jars.sogeo.services
        run: mvn -B -ntp -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

  release:
    name: Create GitHub plugin release
    needs:
      - build
      - publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download plugin ZIP
        uses: actions/download-artifact@v4
        with:
          name: geometry-type-plugin-zip
          path: release-assets

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zip_files < <(find release-assets -type f -name 'hop-geometry-type-plugin-*.zip' | sort)
          if [[ ${#zip_files[@]} -ne 1 ]]; then
            echo "Expected exactly one geometry type plugin ZIP, found ${#zip_files[@]}" >&2
            find release-assets -type f -print || true
            exit 1
          fi

          zip_name="$(basename "${zip_files[0]}")"
          version="$(echo "$zip_name" | sed -E 's/^hop-geometry-type-plugin-([0-9A-Za-z.+_-]+)\.zip$/\1/')"
          if [[ -z "$version" || "$version" == "$zip_name" ]]; then
            echo "Could not resolve version from ZIP filename: $zip_name" >&2
            exit 1
          fi

          safe_version="${version//+/-}"
          timestamp="$(date -u +%Y%m%d-%H%M)"
          short_sha="${GITHUB_SHA::7}"
          echo "tag=auto-v${safe_version}-${timestamp}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=Auto Release ${version} (${timestamp} UTC)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*.zip
